# ==============================================================================
# pyproject.toml — Configuración de packaging moderno (PEP 517/518/621)
# ==============================================================================
# Instalar en modo editable (desarrollo):
#   pip install -e ".[dev]"
#
# Instalar en producción:
#   pip install .
#
# Publicar en PyPI:
#   pip install build twine
#   python -m build
#   twine upload dist/*
# ==============================================================================

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ------------------------------------------------------------------------------
# Metadatos del proyecto
# ------------------------------------------------------------------------------
[project]
name        = "reaper"
version     = "0.1.0"
description = "Librería Python para scraping de Facebook e Instagram"
readme      = "README.md"
license     = { text = "MIT" }
keywords    = ["scraper", "facebook", "instagram", "social-media", "playwright"]

requires-python = ">=3.11"

# Dependencias de producción
dependencies = [
    "playwright>=1.40.0",       # Automatización del navegador (Firefox)
    "beautifulsoup4>=4.12.0",   # Parseo de HTML en los parsers
    "httpx>=0.27.0",            # Cliente HTTP (utils/http.py)
    "requests>=2.31.0",
]

# ------------------------------------------------------------------------------
# Dependencias opcionales
# ------------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=8.0",              # Framework de tests
    "pytest-asyncio>=0.23",     # Soporte async en pytest
    "ruff>=0.4",                # Linter y formateador
    "mypy>=1.10",               # Verificación de tipos estática
]

# ------------------------------------------------------------------------------
# Comandos registrados como ejecutables del sistema
# Después de "pip install -e ." el comando "reaper" estará disponible
# ------------------------------------------------------------------------------
[project.scripts]
reaper = "reaper.cli:main"

# ------------------------------------------------------------------------------
# Configuración de setuptools: buscar paquetes dentro de src/
# ------------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

# ------------------------------------------------------------------------------
# Ruff — linter y formateador (reemplaza flake8 + isort + black)
# ------------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]  # errors, flake8, isort, naming, warnings, pyupgrade

# ------------------------------------------------------------------------------
# Mypy — verificación de tipos
# ------------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true

# ------------------------------------------------------------------------------
# Pytest — configuración de tests
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"           # Todos los tests async sin decorador extra
testpaths    = ["tests"]