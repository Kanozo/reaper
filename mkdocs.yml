site_name: Reaper
site_description: Librería Python para scraping de Facebook e Instagram con cuentas autenticadas, almacenamiento configurable (local/PostgreSQL/MongoDB) y anti-detección integrada
site_author: Reaper Contributors
docs_dir: docs
site_dir: docs_build

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: orange
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
  font:
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            unwrap_annotated: true
            merge_init_into_class: true

nav:
  - Inicio: index.md

  - Manual de Usuario:
    - Instalación: user/installation.md
    - Scraping sin cuentas: user/anonymous.md
    - Cuentas autenticadas: user/accounts.md
    - Almacenamiento (local/PG/Mongo): user/storage.md
    - Login interactivo: user/login.md
    - Acciones de escritura (posts, likes): user/actions.md
    - Gestión del pool: user/pool.md
    - Proxies: user/proxy.md
    - Modo debug: user/debug.md
    - Preguntas frecuentes: user/faq.md

  - Referencia Técnica:
    - Arquitectura: technical/architecture.md
    - Pipeline de scraping: technical/pipeline.md
    - Sistema de autenticación: technical/auth.md
    - Parsers: technical/parsers.md
    - Resultados por tipo: technical/results.md
    - Extender Reaper: technical/extending.md
    - Anti-Detección (anti_detection): anti_scraping.md

  - API Reference:
    - reaper (público): api/public.md
    - reaper.auth: api/auth.md
    - reaper.actions: api/actions.md
    - reaper.config: api/config.md
    - reaper.network: api/network.md
    - reaper.scrapers: api/scrapers.md
    - reaper.parsers: api/parsers.md
    - reaper.utils: api/utils.md

  - Changelog: changelog.md
